name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: native-${{ matrix.os }}
          save-if: false
      - name: Release, signing, and packaging script tests
        if: runner.os == 'Linux'
        env:
          RUSTUP_TOOLCHAIN: 1.99.0
        run: python3 -B -m unittest discover -s tests -p 'test_*.py'
      - name: Windows packaging script tests
        if: runner.os == 'Windows'
        run: python -B -m unittest discover -s tests -p 'test_windows.py'
      - name: macOS packaging script tests
        if: runner.os == 'macOS'
        run: |
          python3 -B -m unittest discover -s tests -p 'test_package.py'
          python3 -B -m unittest discover -s tests -p 'test_distributions.py'
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev libfontconfig1-dev libasound2-dev libxkbcommon-x11-dev libxcb-shape0-dev libxcb-xfixes0-dev libxcb-randr0-dev libwayland-dev libvulkan-dev libpipewire-0.3-dev clang cmake fonts-dejavu-core
      - run: cargo fmt --all -- --check
      - name: Windows core and PTY tests
        if: runner.os == 'Windows'
        run: cargo test --locked --features pty
      - run: cargo test --locked --features ui-tests
      - run: cargo clippy --locked --features ui-tests --all-targets -- -D warnings
