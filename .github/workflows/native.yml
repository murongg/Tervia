name: Native desktop builds
on:
  push:
    branches: [main]
  workflow_call:
    inputs:
      sign-macos:
        description: Require Developer ID signing and Apple notarization for macOS artifacts.
        type: boolean
        default: false
    secrets:
      MACOS_CERTIFICATE:
        required: false
      MACOS_CERTIFICATE_PASSWORD:
        required: false
      APPLE_ID:
        required: false
      APPLE_TEAM_ID:
        required: false
      APPLE_APP_SPECIFIC_PASSWORD:
        required: false
permissions:
  contents: read
env:
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only
concurrency:
  group: native-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' && github.ref_type == 'branch' }}
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Keep the key shared with the reusable release workflow.
          shared-key: native-${{ matrix.os }}
          save-if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
      - name: Release, signing, and packaging script tests
        if: runner.os == 'Linux'
        env:
          RUSTUP_TOOLCHAIN: 1.99.0
        run: python3 -B -m unittest discover -s tests -p 'test_*.py'
      - name: Windows packaging script tests
        if: runner.os == 'Windows'
        run: python -B -m unittest discover -s tests -p 'test_windows.py'
      - name: macOS packaging script tests
        if: runner.os == 'macOS'
        run: |
          python3 -B -m unittest discover -s tests -p 'test_package.py'
          python3 -B -m unittest discover -s tests -p 'test_distributions.py'
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev libfontconfig1-dev libasound2-dev libxkbcommon-x11-dev libxcb-shape0-dev libxcb-xfixes0-dev libxcb-randr0-dev libwayland-dev libvulkan-dev libpipewire-0.3-dev clang cmake fonts-dejavu-core dpkg-dev rpm
      - run: cargo fmt --all -- --check
      - name: Core and PTY tests
        run: cargo test --locked --features pty
      - name: Native UI tests
        # Keep native-only integration tests here so core tests avoid linking GPUI.
        run: cargo test --locked --features ui-tests --bin tervia --test highlight --test list --test manifest
      - run: cargo clippy --locked --features ui-tests --all-targets -- -D warnings
      - run: cargo build --locked --release --features native
      - name: macOS package
        if: runner.os == 'macOS'
        run: |
          ./scripts/package.sh --no-build
      - name: Sign and notarize macOS app
        if: runner.os == 'macOS' && inputs.sign-macos
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: sh scripts/sign.sh build/Tervia.app
      - name: macOS ZIP and DMG
        if: runner.os == 'macOS'
        run: bash scripts/macos.sh
      - name: Linux package
        if: runner.os == 'Linux'
        run: bash scripts/linux.sh --no-build
      - name: Windows package
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup installation failed" }
          ./scripts/windows.ps1 -NoBuild
      - uses: actions/upload-artifact@v7
        with:
          name: Tervia-${{ runner.os }}
          path: |
            build/Tervia-*.tar.gz
            build/Tervia-*.zip
            build/Tervia-*.dmg
            build/Tervia-*.deb
            build/Tervia-*.rpm
            build/Tervia-*-setup.exe
          if-no-files-found: error
