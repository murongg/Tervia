name: Native desktop builds
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev libfontconfig1-dev libasound2-dev libxkbcommon-x11-dev libxcb-shape0-dev libxcb-xfixes0-dev libxcb-randr0-dev libwayland-dev libvulkan-dev libpipewire-0.3-dev clang cmake fonts-dejavu-core
      - run: cargo fmt --all -- --check
      - run: cargo test --features ui-tests
      - run: cargo clippy --features ui-tests --all-targets -- -D warnings
      - run: cargo build --release --features native
      - name: macOS package
        if: runner.os == 'macOS'
        run: |
          cp target/release/tervia target/debug/tervia
          ./scripts/package.sh --no-build
          tar -C build -czf build/Tervia-macos.tar.gz Tervia.app
      - name: Linux package
        if: runner.os == 'Linux'
        run: bash scripts/linux.sh --no-build
      - name: Windows package
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/windows.ps1 -NoBuild
      - uses: actions/upload-artifact@v7
        with:
          name: Tervia-${{ runner.os }}
          path: |
            build/Tervia-*.tar.gz
            build/Tervia-*.zip
          if-no-files-found: error
