[package]
name = "tervia"
version = "0.15.0"
edition = "2024"
rust-version = "1.99"
description = "A native terminal workspace with Git and lightweight editing"
license = "AGPL-3.0-only"
publish = false
default-run = "tervia"

[features]
default = []
pty = ["dep:portable-pty", "dep:async-channel", "dep:getrandom"]
native = ["pty", "dep:gpui-kit", "dep:gpui-test"]
ui-tests = ["native", "gpui-test/test-support"]

[dependencies]
sys-locale = "=0.3.2"
serde_json = "=1.0.154"
serde-saphyr = { version = "=1.3.0", default-features = false, features = ["deserialize"] }
shlex = "=1.3.0"
notify = "=8.2.0"
ignore = "=0.4.33"
regex = "=1.13.1"
sha2 = "=0.10.9"
dirs = "=6.0.0"
tempfile = "=3.27.0"
trash = "=5.2.6"
toml_edit = "=0.25.17"
semver = "=1.0.28"
self_update = { version = "=1.3.0", default-features = false, features = ["ureq", "rustls", "github", "checksums", "archive-tar", "compression-tar-gz", "archive-zip", "compression-zip-deflate"] }
alacritty_terminal = { version = "=0.26.0", default-features = false }
portable-pty = { version = "=0.9.0", optional = true }
async-channel = { version = "2", optional = true }
getrandom = { version = "=0.3.4", optional = true }
# Select application-owned Windows resources even when transitive dependencies enable GPUI defaults.
gpui-test = { package = "gpui-pre", version = "=0.3.8", optional = true, features = ["windows-manifest-provided-by-host"] }
gpui-kit = { version = "=0.7.2", optional = true, features = ["tree-sitter-languages"] }

[target.'cfg(target_os = "windows")'.dependencies]
dunce = "=1.0.5"
windows-registry = "=0.6.1"
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_System_Pipes"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[[bin]]
name = "tervia"
path = "src/main.rs"
required-features = ["native"]

[[bin]]
name = "tervia-session"
path = "src/session.rs"
required-features = ["pty"]

[profile.dev]
debug = 1

[build-dependencies]
embed-resource = "=3.0.12"

[dev-dependencies]
zip = { version = "=8.6.0", default-features = false }

[profile.dev.package."*"]
opt-level = 2

[patch.crates-io]
gpui-pre = { path = "vendor/gpui-pre" }
gpui-component = { path = "vendor/gpui-component" }
