# Tervia configuration. Edit this file, then restart Tervia to apply changes.
# Settings-window changes are saved here, preserving comments and unknown keys.
# Missing keys use defaults. Invalid values leave the file untouched.
# Top-level tables are feature domains; related options live in their subtables.

# User interface: shared language and appearance across the application.
[ui]
# "system", "zh-CN", "zh-TW", "en", "ja", "ko", "fr", "de", "es", "pt", "ru"
language = "system"
# "dark" or "light"
theme = "dark"

# Typography shared by the terminal, editor and application interface.
[ui.fonts]
# Installed font name. Default: Menlo (macOS), Consolas (Windows), DejaVu Sans Mono (Linux).
code_family = "Menlo"
# Terminal and editor font size: 11–24
code_size = 14
# Interface font size: 11–16
ui_size = 13

# Group related files beneath their companion in the same directory. Groups start collapsed.
[files]
nesting = false

# Complete typed prefixes using local shell history and common commands. No model or network requests.
# Disabling this also stops recording new commands. Existing history is retained.
[terminal]
suggestions = true
# New terminals only: "default" (SHELL or platform default), "pwsh", "powershell", "cmd".
shell = "default"

# Opt in to desktop alerts for agent turn completion, failures and requests for input/approval.
[agents]
notifications = false

# Check GitHub Releases at startup and periodically. Downloading/installing still requires confirmation.
[updates]
auto_check = true
# Minutes between completed checks, including manual checks. Valid range: 5–10080 (7 days).
interval_minutes = 60
